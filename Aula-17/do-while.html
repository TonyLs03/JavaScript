<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS - Do While</title>
    <script>
      var x = 11;

      do {
        document.write(x + "<br>");
      } while (x <= 10);
      //   do while executa o bloco de código e só depois verifica a condição, nesse caso
      //   é impressa a variável, se por exemplo essa variável fosse usada em um while nao
      //   seria realizada renderização
    </script>
  </head>
  <body></body>
</html>
