<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tratamento de erros (try, catch, throw e finally)</title>
    <script>
      //netflix

      var video = Array();

      video[1] = Array();
      video[1]["nome"] = "Fullmetal Alchemist";
      video[1]["categoria"] = "Anime";

      function getVideo(video) {
        try {
          //lógica
          //http
          console.log(video[0]["nome"]);
        } catch (erro) {
          tratarErro(erro);
          console.log("Agora sim podemos tratar esse erro.");
          throw new Error(
            "houve um erro e o mesmo está sendo tratado agora mesmo!!!"
          );
        } finally {
          console.log("Sempre passa por aqui (try/catch)");
        }
        console.log("A aplicação não morreu!");
      }

      function tratarErro(e) {
        //logica para registrar o erro no servidor
        console.log(e);
      }

      getVideo(video);
    </script>
  </head>
  <body></body>
</html>
