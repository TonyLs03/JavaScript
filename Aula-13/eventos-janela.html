<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos da janela</title>
    <script></script>
  </head>
  <body onresize="" onscroll="console.log('Evento disparado')">
    <div style="background: #ccc; height: 3000px; width: 130px"></div>
  </body>
</html>

<!-- 
  onresize > quando a janela sofre ajuste de tamanho esse evento é disparado,
  função responsável por observar a janela 
  onscroll > evento disparado quando scroll é acionado, é responsável por observar o scroll do documento 
-->
