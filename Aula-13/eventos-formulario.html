<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos de formulário</title>
    <script></script>
  </head>
  <body>
    <input
      onfocus="console.log('foco ativado')"
      onblur="console.log('perdeu foco')"
      type="text"
    />
    <select onchange="console.log('estado modificado')">
      <option>--Selecione--</option>
      <option value="1">Primeira opção</option>
      <option value="2">Segunda opção</option>
    </select>
  </body>
</html>

<!-- 
  onfocus > ativado quando o elemento html recebe o foco
  onblur > quando o elemento html perde o foco essa função é ativada
  onchange > quando o elemento html ele sofre modificação de estado
-->
