<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS - Ordenação</title>
    <script>
      var lista_frutas = Array();

      lista_frutas[0] = "Maçã";
      lista_frutas[1] = "Uva";
      lista_frutas[2] = "Banana";
      lista_frutas[3] = "Morango";

      console.log(lista_frutas.sort());
    </script>
    <script>
      var lista_numeros = Array();

      lista_numeros[0] = "12";
      lista_numeros[1] = "40";
      lista_numeros[2] = "3";

      console.log(lista_numeros.sort(ordNum));

      function ordNum(a, b) {
        return a - b;
        // < 0 = a ordenado antes de b
        // > 0 = b ordenado antes de a
        // == a ordem é mantida
      }
    </script>
  </head>
  <body></body>
</html>

<!-- 
método sort() oeganiza os itens em ordem alfanumérica, fica uma dica caso o array for
numérico ou uma string que representa números, utilizar um método simples que compara os números
para dentro do método sort assim organizando a string
-->
