<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>atividade de fixação</title>
    <script>
      var objetos = Array("Cadeira", "Impressora", "Garfo");

      function addObj() {
        var objeto = document.getElementById("objeto").value;

        if (objeto != "") {
          if (objetos.indexOf(objeto) !== -1) {
            alert("Objeto já foi adicionado");
          } else {
            objetos.push(objeto);
            console.log(objetos);

            document.getElementById("objeto").value = "";
          }
        } else {
          alert("Informe um objeto válido");
        }
      }
      function ordenarObjetos() {
        objetos.sort();
        console.log(objetos);
      }
    </script>
  </head>
  <body>
    <input type="text" id="objeto" />
    <button onclick="addObj()">Adicionar</button>
    <button onclick="ordenarObjetos">Ordenar</button>
  </body>
</html>
